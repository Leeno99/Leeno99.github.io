<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>랜덤뽑기</title>
<meta name="description" content="이름을 넣으면 공들이 줄어드는 원형 경기장에서 부딪히며 살아남기를 겨루는 랜덤뽑기. 위치 기반 실시간 우승 확률 표시.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#0c0a13;--panel:rgba(255,255,255,.035);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --fg:#f4effd;--mut:#9890b0;--gold:#f5c451;--gold2:#ffe39a;--red:#ff4d6d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  color:var(--fg);font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  background:
    radial-gradient(1100px 620px at 12% -12%,rgba(150,30,80,.38),transparent 60%),
    radial-gradient(900px 640px at 105% 0%,rgba(40,60,170,.30),transparent 58%),
    radial-gradient(800px 500px at 50% 120%,rgba(245,196,81,.10),transparent 60%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;gap:12px;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:#2a1a00;
  background:linear-gradient(145deg,var(--gold2),var(--gold) 55%,#c78d1c);box-shadow:0 6px 22px rgba(245,196,81,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.brand h1{margin:0;font-size:21px;letter-spacing:-.01em;font-weight:900;
  background:linear-gradient(180deg,#fff,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:2px 0 0;font-size:12px;color:var(--mut)}
.status{font-size:13px;color:var(--mut);padding:7px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);min-height:32px;display:flex;align-items:center}

.setup{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--mut);text-transform:uppercase;margin-bottom:7px;display:flex;gap:8px;align-items:baseline}
.lbl small{font-weight:500;letter-spacing:0;text-transform:none;opacity:.8}
textarea{width:100%;height:76px;resize:vertical;min-height:52px;max-height:160px;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);
  background:rgba(0,0,0,.28);color:var(--fg);font:inherit;font-size:14px;line-height:1.5;outline:none;transition:border-color .2s,box-shadow .2s}
textarea:focus{border-color:rgba(245,196,81,.6);box-shadow:0 0 0 3px rgba(245,196,81,.15)}
.opts{display:flex;flex-direction:column;gap:10px;justify-content:space-between;max-width:560px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;cursor:pointer;user-select:none}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600;
  background:rgba(255,255,255,.04);border:1px solid var(--line2);color:var(--mut);transition:all .18s}
.chip:hover span{border-color:rgba(255,255,255,.28);color:var(--fg)}
.chip input:checked+span{background:linear-gradient(180deg,rgba(245,196,81,.2),rgba(245,196,81,.08));border-color:rgba(245,196,81,.55);color:var(--gold2)}
.chip input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,button{font:inherit;font-size:14px;font-weight:700;height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);
  background:rgba(255,255,255,.05);color:var(--fg);cursor:pointer;transition:transform .12s,filter .2s,background .2s}
select{padding-right:10px}
select option{background:#1a1626;color:var(--fg)}
button:hover:not(:disabled){background:rgba(255,255,255,.09)}
button:active:not(:disabled){transform:translateY(1px)}
button.pri{min-width:112px;border:0;color:#2a1a00;background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,#d9a032);
  box-shadow:0 6px 22px rgba(245,196,81,.32),inset 0 1px 0 rgba(255,255,255,.6)}
button.pri:hover:not(:disabled){filter:brightness(1.07);background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,#d9a032)}
button:disabled{opacity:.45;cursor:not-allowed}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr);gap:12px}
.stagewrap{position:relative;min-width:0;min-height:0;border-radius:20px;overflow:hidden;background:#07060c;border:1px solid var(--line);box-shadow:inset 0 0 60px rgba(0,0,0,.5)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.stagewrap.final::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 90px rgba(255,40,80,.5);animation:hb 1s ease-in-out infinite}
@keyframes hb{0%,100%{opacity:.35}15%{opacity:1}30%{opacity:.5}45%{opacity:.9}}
#toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:9;padding:10px 22px;border-radius:999px;
  background:linear-gradient(180deg,rgba(40,24,52,.95),rgba(20,14,32,.95));border:1px solid rgba(245,196,81,.55);color:var(--gold2);
  box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 24px rgba(245,196,81,.2);
  font-weight:800;font-size:clamp(14px,2.1vw,21px);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}

aside{display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto;scrollbar-width:thin}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;backdrop-filter:blur(8px)}
.card h3{margin:0 0 10px;font-size:13px;font-weight:800}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ch h3{margin:0}
.tag{font-size:10px;font-weight:900;letter-spacing:.14em;color:#fff;background:var(--red);padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.counter{text-align:center;background:radial-gradient(120% 100% at 50% 0%,rgba(245,196,81,.16),rgba(245,196,81,0) 65%),var(--panel);border-color:rgba(245,196,81,.28)}
.cap{font-size:11px;font-weight:800;letter-spacing:.24em;color:var(--gold)}
.big{display:flex;justify-content:center;align-items:baseline;gap:6px;margin:4px 0 10px}
.big #remain{font-size:52px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff,var(--gold2) 70%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(245,196,81,.35))}
.big small{font-size:15px;color:var(--mut);font-weight:700;font-variant-numeric:tabular-nums}
.meter{height:6px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
.meter i{display:block;height:100%;width:100%;border-radius:inherit;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .5s ease}
#odds{display:flex;flex-direction:column;gap:6px}
.odd{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:6px 8px;padding:9px 10px 8px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid transparent}
.odd:first-child{background:linear-gradient(90deg,rgba(245,196,81,.14),rgba(245,196,81,.03));border-color:rgba(245,196,81,.35)}
.ix{font-size:12px;font-weight:900;color:var(--mut);text-align:center}
.odd:first-child .ix{color:var(--gold)}
.nm{display:flex;align-items:center;gap:7px;min-width:0;font-weight:700;font-size:14px}
.nm .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm em{font-style:normal;font-size:11px;font-weight:600;color:var(--mut);flex:none}
.dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.pc{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums}
.odd:first-child .pc{color:var(--gold2)}
.bar{grid-column:1/-1;height:4px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.empty,.note{margin:8px 0 0;font-size:11.5px;color:var(--mut);line-height:1.5}
.slot{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.03);font-weight:800;font-size:14px;margin-bottom:6px}
.slot:last-child{margin-bottom:0}
.slot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}
.slot span.on{color:var(--fg)}
.grow{flex:1;min-height:150px;display:flex;flex-direction:column}
#log{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;font-size:13px;scrollbar-width:thin}
#log li{display:flex;gap:10px;padding:6px 2px;border-bottom:1px solid var(--line);animation:in .35s ease}
#log b{min-width:50px;color:var(--mut);font-weight:700;font-variant-numeric:tabular-nums}
#log span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes in{from{opacity:0;transform:translateY(-4px)}}
@media (max-width:860px){
  .app{height:auto;min-height:100dvh}
  .setup{grid-template-columns:1fr}
  .opts{max-width:none}
  main{grid-template-columns:1fr;grid-template-rows:auto auto}
  .stagewrap{height:70vw;min-height:340px;max-height:72vh}
  aside{overflow:visible}
  .grow{max-height:280px}
}
@media (prefers-reduced-motion:reduce){.tag::before{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9.2" stroke="#2a1a00" stroke-width="2.2"/><circle cx="12" cy="12" r="3.3" fill="#2a1a00"/><circle cx="17.4" cy="8.3" r="1.8" fill="#2a1a00" opacity=".7"/><circle cx="7.3" cy="15.8" r="1.5" fill="#2a1a00" opacity=".5"/></svg></div>
      <div><h1>랜덤뽑기</h1><p>마지막까지 경기장에 남는 공은?</p></div>
    </div>
    <div id="status" class="status"></div>
  </header>

  <section class="setup">
    <div>
      <label class="lbl" for="names">참가자 <small>쉼표 또는 줄바꿈으로 구분 · 이름*숫자로 공 개수 지정</small></label>
      <textarea id="names" placeholder="수박*2,키위*2,귤*2">수박*2,키위*2,귤*2</textarea>
    </div>
    <div class="opts">
      <div>
        <div class="lbl">돌발 이벤트</div>
        <div class="chips">
          <label class="chip"><input type="checkbox" class="ev" value="boom" checked><span>☄️ 운석</span></label>
          <label class="chip"><input type="checkbox" class="ev" value="hole" checked><span>🕳️ 블랙홀</span></label>
          <label class="chip"><input type="checkbox" class="ev" value="wave" checked><span>🌊 해일</span></label>
          <label class="chip"><input type="checkbox" class="ev" value="bolt" checked><span>⚡ 번개</span></label>
          <label class="chip"><input type="checkbox" class="ev" value="quake" checked><span>🌋 지진</span></label>
        </div>
      </div>
      <div class="row">
        <select id="speed" aria-label="속도"><option value="slow">느리게</option><option value="normal" selected>보통</option><option value="fast">빠르게</option><option value="turbo">⚡ 초고속</option><option value="once">🎯 한번에 결정</option></select>
        <button id="reset">↺ 초기화</button>
        <button id="start" class="pri">▶ 시작</button>
      </div>
    </div>
  </section>

  <main>
    <div class="stagewrap"><canvas id="cv"></canvas><div id="toast"></div></div>
    <aside>
      <div class="card counter">
        <div class="cap">REMAINING</div>
        <div class="big"><span id="remain">0</span><small>/ <span id="totalN">0</span></small></div>
        <div class="meter"><i id="meter"></i></div>
      </div>
      <div class="card">
        <div class="ch"><h3>🏆 실시간 우승 확률</h3><span class="tag">LIVE</span></div>
        <div id="odds"></div>
        <p class="note" id="oddsNote"></p>
      </div>
      <div class="card">
        <h3>최종 순위</h3>
        <div class="slot">🥇 <span id="s1">?</span></div>
        <div class="slot">🥈 <span id="s2">?</span></div>
        <div class="slot">🥉 <span id="s3">?</span></div>
      </div>
      <div class="card grow">
        <h3>탈락 기록 <small style="color:var(--mut);font-weight:600">최근순</small></h3>
        <ul id="log"></ul>
      </div>
    </aside>
  </main>
</div>
<script>
const $=q=>document.querySelector(q),pick=a=>a[Math.random()*a.length|0],rnd=(a,b)=>a+Math.random()*(b-a),TAU=Math.PI*2;
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const status=t=>$('#status').textContent=t;
const MAXB=500,R0=500,SPEED={slow:.6,normal:1,fast:1.8,turbo:3.2,once:1};
function parse(t){const out=[];t.split(/[,\n]/).forEach(s=>{s=s.trim();if(!s)return;const m=s.match(/^(.+?)\s*\*\s*(\d+)$/);let n=s,c=1;if(m){n=m[1].trim();c=+m[2]}for(let i=0;i<c&&out.length<MAXB;i++)out.push(n)});return out}

/* ---------- state ---------- */
const cv=$('#cv'),ctx=cv.getContext('2d');
let W=1,H=1,DPR=1,scaleNow=1,camR=R0*1.15,camX=0,camY=0,clock=0,spd=1;
let balls=[],falling=[],parts=[],floats=[],haz=[],grads=new Map(),stars=[];
let state='idle',R=R0,minR=10,br=20,t=0,D=30,nextEv=5,aliveN=0,total=0,hue=new Map(),slow=1;
let shakeA=0,flashA=0,flashC='#fff',winner=null,leader=null,nmCool=0,oddsT=0,smooth=new Map(),tt=0;

function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(1,r.width);H=Math.max(1,r.height);cv.width=W*DPR|0;cv.height=H*DPR|0;
  stars=Array.from({length:110},()=>[Math.random()*W,Math.random()*H,Math.random()*1.3+.3,Math.random()])}
new ResizeObserver(resize).observe(cv);
function toast(s,ms){const e=$('#toast');e.textContent=s;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,ms)}
const flash=(c,a=.6)=>{flashC=c;flashA=Math.max(flashA,a)};
const alive=()=>balls.filter(b=>!b.dead);
const em=n=>[...n].reduce((s,c)=>s+(c.charCodeAt(0)>0x2e80?1:.62),0);

/* ---------- setup ---------- */
function build(){
  state='idle';once=null;const raw=parse($('#names').value),names=shuf(raw.slice());total=names.length;aliveN=total;
  hue=new Map();[...new Set(raw)].forEach((n,i)=>hue.set(n,Math.round((i*137.508+28)%360)));
  br=Math.max(6,Math.min(70,R0*Math.sqrt(.3/Math.max(1,total))));minR=br*.4;R=R0;t=0;slow=1;winner=null;leader=null;
  balls=[];falling=[];parts=[];floats=[];haz=[];grads.clear();smooth.clear();
  for(const n of names){let x=0,y=0;for(let k=0;k<40;k++){const a=rnd(0,TAU),d=Math.sqrt(Math.random())*(R0*.82-br);x=Math.cos(a)*d;y=Math.sin(a)*d;if(balls.every(b=>(b.x-x)**2+(b.y-y)**2>4*br*br))break}
    balls.push({n,hue:hue.get(n),x,y,vx:0,vy:0,h:rnd(0,TAU),edge:false,dead:false,w:1,fs:Math.min(br*.62,1.7*br/Math.max(1,em(n)))})}
  $('#log').innerHTML='';[1,2,3].forEach(r=>{const s=$('#s'+r);s.textContent='?';s.classList.remove('on')});
  $('.stagewrap').classList.remove('final');rowMap.forEach(e=>e.remove());rowMap.clear();
  status(total?`준비 완료 · 공 ${total}개${parse($('#names').value).length>=MAXB?' (최대 '+MAXB+'개)':''}`:'이름을 입력하세요');
  $('#start').disabled=total<2;updOdds();
}
function start(){
  if(state==='run'||state==='once')return;build();if(total<2)return;
  if($('#speed').value==='once'){startOnce();return}
  state='run';D=16+6*Math.log2(total);nextEv=4;$('#start').disabled=true;toast('🏁 경기 시작!',1300);status(`남은 ${aliveN} / 전체 ${total}`);
}

/* ---------- ranking ---------- */
function record(n,rank){const li=document.createElement('li'),b=document.createElement('b'),s=document.createElement('span');
  b.textContent=(rank<4?['🥇','🥈','🥉'][rank-1]:'')+rank+'위';s.textContent=n;li.append(b,s);$('#log').prepend(li);
  if(rank<=3){const el=$('#s'+rank);el.textContent=n;el.classList.add('on')}oddsT=0}
function fall(b){
  b.dead=true;const rank=aliveN--;falling.push({x:b.x,y:b.y,vx:b.vx,vy:b.vy,hue:b.hue,n:b.n,fs:b.fs,t:0});record(b.n,rank);
  const d=Math.hypot(b.x,b.y)||1;
  for(let k=0;k<(total>150?3:9);k++)parts.push({x:b.x,y:b.y,vx:b.x/d*rnd(20,140)+rnd(-60,60),vy:b.y/d*rnd(20,140)+rnd(-60,60),life:rnd(.4,.9),t:0,c:`hsl(${b.hue} 85% 65%)`,s:rnd(2,5)*br/20});
  if(aliveN<=30)floats.push({x:b.x,y:b.y,txt:`${b.n} 탈락`,c:'#ff6b81',t:0,life:1.4,sz:Math.max(br*.5,15/scaleNow)});
  status(`남은 ${aliveN} / 전체 ${total}`);
  if(state==='once'){if(aliveN===2||aliveN===1){const r=aliveN+1;toast(`${r===3?'🥉':'🥈'} ${r}위: ${b.n}`,1300);flash(r===2?'#ffd54a':'#fff',.45);shakeA=Math.max(shakeA,10)}}
  else{if(aliveN===3&&total>3){$('.stagewrap').classList.add('final');toast('🔥 최후의 3인!',1500)}
  if(aliveN===2){$('.stagewrap').classList.add('final');slow=$('#speed').value==='turbo'?1:.6;toast('🔥 결승! 1:1',1600)}}
  if(aliveN===1)win();
}
function win(){
  const w=balls.find(b=>!b.dead);winner=w;state='done';haz=[];slow=1;record(w.n,1);
  toast(`🎉 우승: ${w.n}`,5000);flash('#ffd54a',.7);
  for(let k=0;k<160;k++){const a=rnd(0,TAU),m=rnd(80,420);parts.push({x:w.x,y:w.y,vx:Math.cos(a)*m,vy:Math.sin(a)*m,life:rnd(.8,1.8),t:0,c:pick(['#ffd54a','#ff6b4a','#4ab8ff','#3ddc84','#c58bff','#fff']),s:rnd(1.5,3.5)*Math.max(1,br/30)})}
  $('.stagewrap').classList.remove('final');status('🎉 추첨 완료!');$('#start').disabled=false;oddsT=0;
}

/* ---------- physics ---------- */
function collide(){
  const cs=br*2,m2=cs*cs,g=new Map(),A=alive(),key=(x,y)=>x*4096+y;
  A.forEach((b,i)=>{b.cx=(b.x/cs+1000)|0;b.cy=(b.y/cs+1000)|0;const k=key(b.cx,b.cy);let c=g.get(k);if(!c)g.set(k,c=[]);c.push(i)});
  for(let i=0;i<A.length;i++){const a=A[i];
    for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){const c=g.get(key(a.cx+ox,a.cy+oy));if(!c)continue;
      for(const j of c){if(j<=i)continue;const b=A[j];let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;if(d2>=m2)continue;
        if(d2<1e-6){dx=rnd(-1,1);dy=rnd(-1,1);d2=dx*dx+dy*dy}
        const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ov=(cs-d)/2;a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;

let once=null;

  const Rm=Math.max(br,...others.map(o=>o.d))+br*1.2,n=others.length;

  if(n>=2)others[n-2].ft=Math.max(others[n-2].ft,pre+T+.7);

  toast('🎯 운명의 심판!',1700);flash('#fff',.5);shakeA=12;
  haz.push({draw(){if(!once)return;const o=once,x=o.w.x,y=o.w.y,k=Math.max(0,Math.min(1,(o.t-o.pre)/o.T));

const rowMap=new Map();

  if(!total){rowMap.forEach(e=>e.remove());rowMap.clear();box.innerHTML='<p class="empty">참가자를 입력하세요</p>';$('#oddsNote').textContent='';return}

  for(const h of haz)if(h.draw&&!h.top)h.draw();
  for(const f of falling){const k=f.t/.9;drawBall(f.x,f.y,f.hue,f.fs,f.n,Math.max(.01,1-k),Math.min(.85,k*1.1))}
  for(const b of balls)if(!b.dead)drawBall(b.x,b.y,b.hue,b.fs,b.n);
  if(leader&&aliveN<=50){ctx.font=`${br*.85}px sans-serif`;ctx.fillText('👑',leader.x,leader.y-br*1.25)}
  if(fw){const p=1+.08*Math.sin(clock*5);ctx.strokeStyle='rgba(255,213,74,.9)';ctx.lineWidth=br*.12;ctx.beginPath();ctx.arc(winner.x,winner.y,br*1.25*p,0,TAU);ctx.stroke();
    ctx.font=`${br*1.1}px sans-serif`;ctx.fillText('👑',winner.x,winner.y-br*1.65)}
  for(const h of haz)if(h.draw&&h.top)h.draw();
  for(const p of parts){ctx.globalAlpha=Math.max(0,1-p.t/p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,TAU);ctx.fill()}ctx.globalAlpha=1;
  for(const f of floats){const k=f.t/f.life;ctx.globalAlpha=k<.15?k/.15:1-Math.max(0,(k-.5)/.5);ctx.font=`900 ${f.sz}px "Pretendard Variable",Pretendard,sans-serif`;
    ctx.lineWidth=f.sz*.22;ctx.strokeStyle='rgba(0,0,0,.75)';ctx.strokeText(f.txt,f.x,f.y);ctx.fillStyle=f.c;ctx.fillText(f.txt,f.x,f.y)}ctx.globalAlpha=1;
  ctx.restore();
  if(flashA>0){ctx.globalAlpha=flashA;ctx.fillStyle=flashC;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
}

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){
  const rdt=Math.min(.05,(now-last)/1000);last=now;clock+=rdt;
  const sim=rdt*spd*slow,n=Math.max(1,Math.ceil(sim/(1/120)));for(let i=0;i<n;i++)step(sim/n);
  for(const p of parts){p.t+=sim;p.x+=p.vx*sim;p.y+=p.vy*sim;p.vx*=.97;p.vy*=.97}parts=parts.filter(p=>p.t<p.life);if(parts.length>1200)parts.splice(0,parts.length-1200);
  for(const f of floats){f.t+=sim;f.y-=40*sim}floats=floats.filter(f=>f.t<f.life);
  for(const f of falling){f.t+=sim;f.x+=f.vx*sim*.4;f.y+=f.vy*sim*.4}falling=falling.filter(f=>f.t<.9);
  if(state==='run'&&Math.random()<rdt*24){const a=rnd(0,TAU);parts.push({x:Math.cos(a)*R,y:Math.sin(a)*R,vx:Math.cos(a)*rnd(20,60),vy:Math.sin(a)*rnd(20,60),life:rnd(.5,1),t:0,c:pick(['#6b5a7a','#8a6a4a','#f5c451']),s:rnd(2,4)*Math.max(1,br/22)})}
  nmCool-=rdt;shakeA=shakeA>.3?shakeA*Math.pow(.015,rdt):0;flashA=Math.max(0,flashA-rdt*2.2);
  oddsT-=rdt;if(oddsT<=0){updOdds();oddsT=.25}
  draw(rdt);requestAnimationFrame(loop);
}

/* ---------- ui ---------- */
const readSpd=()=>{spd=SPEED[$('#speed').value]||1};
$('#speed').addEventListener('change',readSpd);readSpd();
$('#start').onclick=start;
$('#reset').onclick=build;
let dt;$('#names').addEventListener('input',()=>{if(state==='run'||state==='once')return;clearTimeout(dt);dt=setTimeout(build,300)});
resize();build();requestAnimationFrame(loop);
</script>
